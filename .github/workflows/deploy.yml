name: Deploy to VPS (CD)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check VPS configuration
        id: check_secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "VPS secrets configured. Proceeding with deployment."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets (VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY) are not set. Skipping live deployment."
            echo "To enable automatic deployment, add these secrets to your GitHub repository settings."
          fi

      - name: Setup SSH Keys
        if: steps.check_secrets.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure Known Hosts
        if: steps.check_secrets.outputs.configured == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH to VPS
        if: steps.check_secrets.outputs.configured == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            echo "=== Iniciando Deploy do Compas na VPS ==="
            cd /opt/compas || mkdir -p /opt/compas && cd /opt/compas
            
            # Captura commit atual antes do update para restaurar em caso de rollback
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")

            # Atualiza codigo da branch main
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            fi

            # Backup das imagens atuais se existirem
            if docker image inspect compas-api:latest >/dev/null 2>&1; then
              docker tag compas-api:latest compas-api:previous
            fi
            if docker image inspect compas-frontend:latest >/dev/null 2>&1; then
              docker tag compas-frontend:latest compas-frontend:previous
            fi

            # Define arquivo de compose
            COMPOSE_FILE="docker-compose.yml"
            if [ -f "docker/docker-compose.prod.yml" ]; then
              COMPOSE_FILE="docker/docker-compose.prod.yml"
            fi

            # Build e inicializacao dos containers
            docker compose -f "$COMPOSE_FILE" up -d --build

            echo "=== Aguardando inicialização do serviço (Healthcheck) ==="
            RETRIES=10
            SUCCESS=0
            for i in $(seq 1 $RETRIES); do
              echo "Healthcheck tentativa $i de $RETRIES..."
              if curl -s -f http://127.0.0.1:8080/health | grep -q "status"; then
                echo "Healthcheck OK! Serviço respondendo perfeitamente."
                SUCCESS=1
                break
              fi
              sleep 5
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERRO: Healthcheck falhou apos $RETRIES tentativas. Iniciando ROLLBACK..."
              if [ -n "$PREV_COMMIT" ] && [ -d ".git" ]; then
                git checkout "$PREV_COMMIT"
              fi
              if docker image inspect compas-api:previous >/dev/null 2>&1; then
                docker tag compas-api:previous compas-api:latest
              fi
              if docker image inspect compas-frontend:previous >/dev/null 2>&1; then
                docker tag compas-frontend:previous compas-frontend:latest
              fi
              docker compose -f "$COMPOSE_FILE" up -d
              echo "Rollback concluido para a versao estavel anterior."
              exit 1
            fi

            echo "=== Deploy concluido com 100% de sucesso! ==="
          EOF
