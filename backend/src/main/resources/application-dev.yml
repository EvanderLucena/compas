spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/nutriai
    username: nutriai
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:nutriai-redis-dev-password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    clean-disabled: false

logging:
  level:
    com.nutriai: DEBUG

nutriai:
  jwt:
    secret: ${COMPAS_JWT_SECRET:${NUTRIAI_JWT_SECRET:local-dev-secret-do-not-use-in-production}}
    cookie:
      secure: false
      same-site: Lax
  webhook:
    secret: ${COMPAS_WEBHOOK_SECRET:${NUTRIAI_WEBHOOK_SECRET:}}
  seed:
    admin:
      email: ${COMPAS_SEED_ADMIN_EMAIL:${NUTRIAI_SEED_ADMIN_EMAIL:admin@compas.app}}
      password: ${COMPAS_SEED_ADMIN_PASSWORD:${NUTRIAI_SEED_ADMIN_PASSWORD:Admin123!}}
      name: ${COMPAS_SEED_ADMIN_NAME:${NUTRIAI_SEED_ADMIN_NAME:Admin Compas}}