spring:
  application:
    name: nutriai-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/nutriai}
    username: ${SPRING_DATASOURCE_USERNAME:nutriai}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:15}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 20000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

nutriai:
  version: 0.2.0
  jwt:
    secret: ${NUTRIAI_JWT_SECRET}
    access-token-expiration: 900000    # 15 minutes in ms
    refresh-token-expiration: 604800000 # 7 days in ms
    cookie:
      name: nutriai_refresh
      path: /api/v1/auth
      max-age: 604800   # 7 days in seconds
      http-only: true
      secure: false     # true in production
      same-site: Lax    # Lax for dev (cross-port), Strict for production

  llm:
    base-url: ${NUTRIAI_LLM_BASE_URL:https://ollama.com/v1}
    model: ${NUTRIAI_LLM_MODEL:deepseek-v4.1-flash}
    api-key: ${NUTRIAI_LLM_API_KEY:}
    timeout-seconds: ${NUTRIAI_LLM_TIMEOUT:30}

  whisper:
    base-url: ${NUTRIAI_WHISPER_BASE_URL:https://api.openai.com/v1}
    model: ${NUTRIAI_WHISPER_MODEL:whisper-1}
    api-key: ${NUTRIAI_WHISPER_API_KEY:}
    language: ${NUTRIAI_WHISPER_LANGUAGE:pt}
    enabled: ${NUTRIAI_WHISPER_ENABLED:true}
    timeout-seconds: ${NUTRIAI_WHISPER_TIMEOUT:30}

  evolution:
    api-url: ${EVOLUTION_API_URL:http://evolution-go:8080}
    api-key: ${EVOLUTION_API_KEY:}

  whatsapp:
    central-number: ${NUTRIAI_WHATSAPP_CENTRAL_NUMBER:}
    unknown-response-enabled: ${NUTRIAI_WHATSAPP_UNKNOWN_RESPONSE_ENABLED:true}
    unknown-response-template: "${NUTRIAI_WHATSAPP_UNKNOWN_RESPONSE_TEMPLATE:Olá! Sou a assistente inteligente da NutriAI 🥗. Ainda não localizei seu WhatsApp cadastrado com nenhum nutricionista na nossa plataforma.\n\nPor favor, peça ao seu nutricionista para cadastrar seu número no painel NutriAI para que possamos começar a acompanhar seu plano alimentar!}"
    worker:
      max-concurrent: ${NUTRIAI_WHATSAPP_WORKER_CONCURRENT:5}

  webhook:
    # Secret for authenticating inbound webhook requests (X-Webhook-Secret, apikey, or Bearer)
    secret: ${NUTRIAI_WEBHOOK_SECRET:}