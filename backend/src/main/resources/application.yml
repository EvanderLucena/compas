spring:
  application:
    name: ${COMPAS_APP_NAME:${SPRING_APPLICATION_NAME:compas-api}}

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:${COMPAS_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/nutriai}}
    username: ${SPRING_DATASOURCE_USERNAME:${COMPAS_DATASOURCE_USERNAME:nutriai}}
    password: ${SPRING_DATASOURCE_PASSWORD:${COMPAS_DATASOURCE_PASSWORD:${NUTRIAI_DATASOURCE_PASSWORD:changeme}}}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:15}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 20000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

compas:
  version: 0.5.0
  auth:
    public-signup-enabled: ${PUBLIC_SIGNUP_ENABLED:false}
  seed:
    admin:
      enabled: ${COMPAS_SEED_ADMIN_ENABLED:false}
      email: ${COMPAS_SEED_ADMIN_EMAIL:${NUTRIAI_SEED_ADMIN_EMAIL:admin@compas.app}}
      password: ${COMPAS_SEED_ADMIN_PASSWORD:${NUTRIAI_SEED_ADMIN_PASSWORD:}}
      name: ${COMPAS_SEED_ADMIN_NAME:${NUTRIAI_SEED_ADMIN_NAME:Admin Compas}}
  jwt:
    secret: ${COMPAS_JWT_SECRET:${NUTRIAI_JWT_SECRET}}
    access-token-expiration: 900000    # 15 minutes in ms
    refresh-token-expiration: 604800000 # 7 days in ms
    cookie:
      name: ${COMPAS_REFRESH_COOKIE_NAME:compas_refresh}
      path: /api/v1/auth
      max-age: 604800   # 7 days in seconds
      http-only: true
      secure: false     # true in production
      same-site: Lax    # Lax for dev (cross-port), Strict for production

  llm:
    base-url: ${COMPAS_LLM_BASE_URL:${NUTRIAI_LLM_BASE_URL:https://ollama.com/v1}}
    model: ${COMPAS_LLM_MODEL:${NUTRIAI_LLM_MODEL:deepseek-v4.1-flash}}
    api-key: ${COMPAS_LLM_API_KEY:${NUTRIAI_LLM_API_KEY:}}
    timeout-seconds: ${COMPAS_LLM_TIMEOUT:${NUTRIAI_LLM_TIMEOUT:30}}

  whisper:
    base-url: ${COMPAS_WHISPER_BASE_URL:${NUTRIAI_WHISPER_BASE_URL:https://api.openai.com/v1}}
    model: ${COMPAS_WHISPER_MODEL:${NUTRIAI_WHISPER_MODEL:whisper-1}}
    api-key: ${COMPAS_WHISPER_API_KEY:${NUTRIAI_WHISPER_API_KEY:}}
    language: ${COMPAS_WHISPER_LANGUAGE:${NUTRIAI_WHISPER_LANGUAGE:pt}}
    enabled: ${COMPAS_WHISPER_ENABLED:${NUTRIAI_WHISPER_ENABLED:true}}
    timeout-seconds: ${COMPAS_WHISPER_TIMEOUT:${NUTRIAI_WHISPER_TIMEOUT:30}}

  jev:
    api-url: ${COMPAS_JEV_API_URL:${NUTRIAI_JEV_API_URL:https://api.typesafe.ai/v1/systemone}}
    model: ${COMPAS_JEV_MODEL:${NUTRIAI_JEV_MODEL:jev-latest}}
    api-key: ${COMPAS_JEV_API_KEY:${NUTRIAI_JEV_API_KEY:}}
    enabled: ${COMPAS_JEV_ENABLED:${NUTRIAI_JEV_ENABLED:true}}
    timeout-seconds: ${COMPAS_JEV_TIMEOUT_SECONDS:${NUTRIAI_JEV_TIMEOUT_SECONDS:5}}

  evolution:
    api-url: ${EVOLUTION_API_URL:http://evolution-go:8080}
    api-key: ${EVOLUTION_API_KEY:}
    instance-name: ${COMPAS_EVOLUTION_INSTANCE_NAME:${NUTRIAI_EVOLUTION_INSTANCE_NAME:compas}}

  whatsapp:
    central-number: ${COMPAS_WHATSAPP_CENTRAL_NUMBER:${NUTRIAI_WHATSAPP_CENTRAL_NUMBER:}}
    unknown-response-enabled: ${COMPAS_WHATSAPP_UNKNOWN_RESPONSE_ENABLED:${NUTRIAI_WHATSAPP_UNKNOWN_RESPONSE_ENABLED:true}}
    unknown-response-template: "${COMPAS_WHATSAPP_UNKNOWN_RESPONSE_TEMPLATE:${NUTRIAI_WHATSAPP_UNKNOWN_RESPONSE_TEMPLATE:Olá! Sou a assistente inteligente do Compas 🧭. Ainda não localizei seu WhatsApp cadastrado com nenhum nutricionista na nossa plataforma.\n\nPor favor, peça ao seu nutricionista para cadastrar seu número no painel Compas para que possamos começar a acompanhar seu plano alimentar!}}"
    worker:
      max-concurrent: ${COMPAS_WHATSAPP_WORKER_CONCURRENT:${NUTRIAI_WHATSAPP_WORKER_CONCURRENT:5}}

  email:
    resend-api-key: ${COMPAS_RESEND_API_KEY:${RESEND_API_KEY:}}
    from: ${COMPAS_EMAIL_FROM:Compas <nao-responder@compas.app>}
    verification-base-url: ${COMPAS_FRONTEND_URL:http://localhost:5173}
    enabled: ${COMPAS_EMAIL_ENABLED:true}

  webhook:
    # Secret for authenticating inbound webhook requests (X-Webhook-Secret, apikey, or Bearer)
    secret: ${COMPAS_WEBHOOK_SECRET:${NUTRIAI_WEBHOOK_SECRET:}}

nutriai:
  version: ${compas.version}
  auth:
    public-signup-enabled: ${compas.auth.public-signup-enabled}
  seed:
    admin:
      enabled: ${compas.seed.admin.enabled}
      email: ${compas.seed.admin.email}
      password: ${compas.seed.admin.password}
      name: ${compas.seed.admin.name}
  jwt:
    secret: ${compas.jwt.secret}
    access-token-expiration: ${compas.jwt.access-token-expiration}
    refresh-token-expiration: ${compas.jwt.refresh-token-expiration}
    cookie:
      name: ${compas.jwt.cookie.name}
      path: ${compas.jwt.cookie.path}
      max-age: ${compas.jwt.cookie.max-age}
      http-only: ${compas.jwt.cookie.http-only}
      secure: ${compas.jwt.cookie.secure}
      same-site: ${compas.jwt.cookie.same-site}
  llm:
    base-url: ${compas.llm.base-url}
    model: ${compas.llm.model}
    api-key: ${compas.llm.api-key}
    timeout-seconds: ${compas.llm.timeout-seconds}
  whisper:
    base-url: ${compas.whisper.base-url}
    model: ${compas.whisper.model}
    api-key: ${compas.whisper.api-key}
    language: ${compas.whisper.language}
    enabled: ${compas.whisper.enabled}
    timeout-seconds: ${compas.whisper.timeout-seconds}
  jev:
    api-url: ${compas.jev.api-url}
    model: ${compas.jev.model}
    api-key: ${compas.jev.api-key}
    enabled: ${compas.jev.enabled}
    timeout-seconds: ${compas.jev.timeout-seconds}
  evolution:
    api-url: ${compas.evolution.api-url}
    api-key: ${compas.evolution.api-key}
    instance-name: ${compas.evolution.instance-name}
  whatsapp:
    central-number: ${compas.whatsapp.central-number}
    unknown-response-enabled: ${compas.whatsapp.unknown-response-enabled}
    unknown-response-template: ${compas.whatsapp.unknown-response-template}
    worker:
      max-concurrent: ${compas.whatsapp.worker.max-concurrent}
  webhook:
    secret: ${compas.webhook.secret}