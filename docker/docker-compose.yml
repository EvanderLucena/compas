services:
  postgres:
    image: postgres:17-alpine
    container_name: nutriai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutriai}
      POSTGRES_USER: ${POSTGRES_USER:-nutriai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nutriai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutriai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nutriai

  redis:
    image: redis:7-alpine
    container_name: nutriai-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-nutriai-redis-dev-password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:-nutriai-redis-dev-password} redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nutriai

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: nutriai-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutriai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutriai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      NUTRIAI_JWT_SECRET: ${NUTRIAI_JWT_SECRET:-ci-dev-secret-minimum-32-chars-ok!}
      NUTRIAI_SEED_ADMIN_PASSWORD: ${NUTRIAI_SEED_ADMIN_PASSWORD:-admin123}
      NUTRIAI_LLM_API_KEY: ${NUTRIAI_LLM_API_KEY:-}
      NUTRIAI_LLM_BASE_URL: ${NUTRIAI_LLM_BASE_URL:-https://api.ollama.com/v1}
      NUTRIAI_LLM_MODEL: ${NUTRIAI_LLM_MODEL:-glm4}
      NUTRIAI_LLM_TIMEOUT: ${NUTRIAI_LLM_TIMEOUT:-30}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-changeme}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-go:8080}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-nutriai-redis-dev-password}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutriai

  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: nutriai-evolution
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: nutriai
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-nutriai-dev-key-2026}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-postgresql://nutriai:changeme@postgres:5432/evogo_auth?sslmode=disable}
      POSTGRES_USERS_DB: ${POSTGRES_USERS_DB:-postgresql://nutriai:changeme@postgres:5432/evogo_users?sslmode=disable}
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: INFO
      LOGTYPE: console
      WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://192.168.3.5:8085/api/v1/webhooks/whatsapp}
      WEBHOOK_FILES: "false"
      TZ: America/Sao_Paulo
    ports:
      - "${EVOLUTION_PORT:-8081}:8080"
    volumes:
      - nutriai-evolution-data:/evolution-instance
    networks:
      - nutriai

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: nutriai-frontend
    environment:
      VITE_API_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - nutriai

volumes:
  nutriai-pgdata:
  nutriai-evolution-data:

networks:
  nutriai:
    driver: bridge
