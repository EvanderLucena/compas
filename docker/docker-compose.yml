services:
  postgres:
    image: postgres:17-alpine
    container_name: compas-postgres
    environment:
      POSTGRES_DB: ${COMPAS_DB:-${POSTGRES_DB:-nutriai}}
      POSTGRES_USER: ${COMPAS_USER:-${POSTGRES_USER:-nutriai}}
      POSTGRES_PASSWORD: ${COMPAS_PASSWORD:-${POSTGRES_PASSWORD:-changeme}}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - compas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPAS_USER:-${POSTGRES_USER:-nutriai}}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compas

  redis:
    image: redis:7-alpine
    container_name: compas-redis
    command: ["redis-server", "--requirepass", "${COMPAS_REDIS_PASSWORD:-${REDIS_PASSWORD:-compas-redis-dev-password}}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${COMPAS_REDIS_PASSWORD:-${REDIS_PASSWORD:-compas-redis-dev-password}} redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compas

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: compas-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${COMPAS_DB:-${POSTGRES_DB:-nutriai}}
      SPRING_DATASOURCE_USERNAME: ${COMPAS_USER:-${POSTGRES_USER:-nutriai}}
      SPRING_DATASOURCE_PASSWORD: ${COMPAS_PASSWORD:-${POSTGRES_PASSWORD:-changeme}}
      COMPAS_JWT_SECRET: ${COMPAS_JWT_SECRET:-${NUTRIAI_JWT_SECRET:-ci-dev-secret-minimum-32-chars-ok!}}
      NUTRIAI_JWT_SECRET: ${COMPAS_JWT_SECRET:-${NUTRIAI_JWT_SECRET:-ci-dev-secret-minimum-32-chars-ok!}}
      COMPAS_SEED_ADMIN_PASSWORD: ${COMPAS_SEED_ADMIN_PASSWORD:-${NUTRIAI_SEED_ADMIN_PASSWORD:-admin123}}
      NUTRIAI_SEED_ADMIN_PASSWORD: ${COMPAS_SEED_ADMIN_PASSWORD:-${NUTRIAI_SEED_ADMIN_PASSWORD:-admin123}}
      COMPAS_SEED_ADMIN_NAME: ${COMPAS_SEED_ADMIN_NAME:-Admin Compas}
      COMPAS_LLM_API_KEY: ${COMPAS_LLM_API_KEY:-${NUTRIAI_LLM_API_KEY:-}}
      COMPAS_LLM_BASE_URL: ${COMPAS_LLM_BASE_URL:-${NUTRIAI_LLM_BASE_URL:-https://api.ollama.com/v1}}
      COMPAS_LLM_MODEL: ${COMPAS_LLM_MODEL:-${NUTRIAI_LLM_MODEL:-deepseek-v4.1-flash}}
      COMPAS_LLM_TIMEOUT: ${COMPAS_LLM_TIMEOUT:-${NUTRIAI_LLM_TIMEOUT:-30}}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-compas-dev-key-2026}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-go:8080}
      COMPAS_WEBHOOK_SECRET: ${COMPAS_WEBHOOK_SECRET:-${NUTRIAI_WEBHOOK_SECRET:-}}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${COMPAS_REDIS_PASSWORD:-${REDIS_PASSWORD:-compas-redis-dev-password}}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - compas

  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: compas-evolution
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: compas
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-compas-dev-key-2026}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-postgresql://${COMPAS_USER:-${POSTGRES_USER:-nutriai}}:${COMPAS_PASSWORD:-${POSTGRES_PASSWORD:-changeme}}@postgres:5432/evogo_auth?sslmode=disable}
      POSTGRES_USERS_DB: ${POSTGRES_USERS_DB:-postgresql://${COMPAS_USER:-${POSTGRES_USER:-nutriai}}:${COMPAS_PASSWORD:-${POSTGRES_PASSWORD:-changeme}}@postgres:5432/evogo_users?sslmode=disable}
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: INFO
      LOGTYPE: console
      WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://192.168.3.5:8085/api/v1/webhooks/whatsapp}
      WEBHOOK_FILES: "false"
      TZ: America/Sao_Paulo
    ports:
      - "${EVOLUTION_PORT:-8081}:8080"
    volumes:
      - compas-evolution-data:/evolution-instance
    networks:
      - compas

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: compas-frontend
    environment:
      VITE_API_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - compas

volumes:
  compas-pgdata:
  compas-evolution-data:

networks:
  compas:
    driver: bridge
